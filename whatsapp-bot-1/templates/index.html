<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chatbot Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <header>
            <h1>🤖 WhatsApp Chatbot Dashboard</h1>
            <p>Powered by Flask + Twilio + ngrok</p>
        </header>

        <div class="cards">

            <div class="card">
                <h2>Bot Status</h2>
                <p class="status online">🟢 Online</p>
            </div>

            <div class="card">
                <h2>Current Reply</h2>
                <p>Hello World from WhatsApp Bot!</p>
            </div>

            <div class="card">
                <h2>Technologies</h2>
                <ul>
                    <li>Python</li>
                    <li>Flask</li>
                    <li>Twilio</li>
                    <li>ngrok</li>
                </ul>
            </div>

        </div>

        <div class="chat-section">
            <h2>Chat Preview</h2>

            <div class="chat-box">
                <div class="user-msg">
                    Hi
                </div>

                <div class="bot-msg">
                    Hello World from WhatsApp Bot!
                </div>
            </div>

            <button onclick="showMessage()">Test Bot</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
